server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # This server is what the `share` profile puts on a public URL, so it states the basics.
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Single-page app: unknown paths fall back to the shell so the browser never sees a 404 page.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Live locker updates (Server-Sent Events): a long-lived response that must stream, not buffer.
  location = /api/lockers/events {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 24h;
  }

  # Backend behind the same origin. The path is passed through unchanged (/api/lockers -> api:3000/api/lockers),
  # and X-Forwarded-For lets the API's per-IP rate limits see the real client (TRUST_PROXY=true).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
